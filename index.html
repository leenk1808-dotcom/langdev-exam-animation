<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>언어발달장애 국시 영상 (voice: elevenlabs.io)</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#fffaf0 0%,#fbf1df 60%,#f4e4c8 100%);color:#3a2f24;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:48px 24px 60px}
.kick{font-size:15px;font-weight:800;letter-spacing:.16em;color:#e07a3f}
h1{font-size:40px;margin:10px 0 6px;font-weight:900}
.lead{font-size:17px;color:#8a7558;margin:0 0 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{display:block;text-decoration:none;color:inherit;background:#fff;border:3px solid #ead9bd;border-radius:22px;padding:20px 22px;box-shadow:0 8px 22px rgba(120,80,30,.10);transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-3px);border-color:#f08a24}
.card .no{font-size:14px;font-weight:900;color:#e8781e}
.card .tt{font-size:22px;font-weight:900;margin:6px 0 6px}
.card .ds{font-size:15px;color:#8a7558;line-height:1.5}
.card .meta{margin-top:12px;font-size:13px;font-weight:800;color:#fff;background:#f08a24;display:inline-block;padding:4px 12px;border-radius:14px}
.card.soon{opacity:.55}
.card.soon .meta{background:#c9b99f}
.chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.chips a{font-size:12px;font-weight:700;color:#6f6252;background:#f6ecdc;border-radius:10px;padding:3px 9px;text-decoration:none}
.chips a:hover{background:#fde0c0}
.foot{margin-top:36px;font-size:13px;color:#a8988a;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
 <div class="kick">언어재활사 2급 국가시험 대비</div>
 <h1>언어발달장애 영상</h1>
 <p class="lead">교재를 바탕으로 강의 자료를 보충해 주제별로 정리한 2D 애니메이션 강의. ★ 는 기출 포인트.</p>
 <div class="grid" id="grid"></div>
 <div class="foot">재생 단축키: Space 재생/정지 · J/L 10초 이동 · ←/→ 이전·다음 대사 · &lt; &gt; 속도 · F 전체화면<br>음성: elevenlabs.io · 개인 학습용</div>
</div>
<script>
const EPS=[
 {n:1,t:'개관과 언어습득 이론',d:'의사소통 · 언어의 구성 · 정의와 분류 · 위험/보호요인 · 습득 이론 6가지',f:'ep1.html',len:'약 14분',pages:['1-1 의사소통 · 언어 · 말','1-2 언어의 구성요소','1-3 언어발달장애란','1-4 위험 · 보호요인','1-5 분류','1-6 중증도 · 영역별 결함','1-7 습득 이론의 큰 그림','1-8 행동주의 · 생득주의','1-9 인지 · 의미론 · 상호작용','1-10 다원적 · 정보처리','1-11 확인 문제']},
 {n:2,t:'0~3세 초기 언어발달',d:'감각운동기 · 상징놀이 · 언어이전기 의사소통 · 첫 낱말 · 문장 이해 전략'},
 {n:3,t:'의미 · 형태구문 · 화용 발달',d:'어휘 폭발 · 의미관계 · 문법형태소 · 의사소통 기능 · 대화 기술'},
 {n:4,t:'이야기 · 읽기 · 상위언어',d:'T-unit · 이야기 문법 · 결속표지 · 읽기 단계 · 음운인식'},
 {n:5,t:'SLI/DLD · 말늦은 아동 · 언어학습장애',d:'배제적 진단 · 영역별 특성 · 예측 요인 · 읽기장애'},
 {n:6,t:'자폐스펙트럼장애',d:'사회인지 3이론 · 공동관심 · 반향어 · 영역별 특성'},
 {n:7,t:'지적장애 · 청각장애 · 위험군',d:'지적장애 진단 3요소 · 청각과 언어 · 이중언어 평가'},
 {n:8,t:'평가 절차와 검사도구',d:'선별 · 진단 · 역동적 평가 · 최신 검사도구'},
 {n:9,t:'음운평가와 자발화 · 의미 분석',d:'음운변동 · 발화 구분 · 의미유형 · TTR'},
 {n:10,t:'구문 · 화용 · 이야기 분석',d:'MLU · 문법형태소 · 자발성 · 이야기 평가 지표'},
 {n:11,t:'중재 계획과 치료 기법',d:'목표 선정 · 행동목표 · 강화 · 아동중심/절충 기법'},
 {n:12,t:'특정 언어치료 프로그램',d:'스크립트 · 낱말찾기 · 장벽게임 · AAC · PECS'},
 {n:13,t:'놀이와 학령기 중재',d:'상징놀이 단계 · 교과과정 기반 · 철자 교수법'},
 {n:14,t:'보고서 작성',d:'진단보고서 · 장단기 계획서 · 진전보고서'}];
document.getElementById('grid').innerHTML=EPS.map(e=>e.f?
 `<div class="card"><a href="${e.f}" style="text-decoration:none;color:inherit"><div class="no">${e.n}편</div><div class="tt">${e.t}</div><div class="ds">${e.d}</div><span class="meta">▶ 보기 · ${e.len}</span></a><div class="chips">${e.pages.map(p=>`<a href="${e.f}#${p.split(' ')[0]}">${p}</a>`).join('')}</div></div>`:
 `<div class="card soon"><div class="no">${e.n}편</div><div class="tt">${e.t}</div><div class="ds">${e.d}</div><span class="meta">준비 중</span></div>`).join('');
</script>
</body>
</html>
